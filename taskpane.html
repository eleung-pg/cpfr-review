<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPFR Weekly Review</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root { --fg:#201f1e; --muted:#605e5c; --line:#e1dfdd; --accent:#0f6cbd; --bg:#fff; --soft:#f3f2f1; --bad:#a4262c; --warn:#8a5a00; --ok:#107c10; }
  * { box-sizing: border-box; }
  body { margin:0; padding:12px 16px 24px; font:13px/1.45 "Segoe UI",system-ui,sans-serif; color:var(--fg); background:var(--bg); }
  h1 { font-size:16px; margin:0 0 2px; } h2 { font-size:13px; margin:16px 0 6px; }
  .sub { color:var(--muted); margin-bottom:10px; }
  label { display:block; margin:8px 0 2px; font-weight:600; }
  select, input[type=number] { width:100%; padding:5px 6px; border:1px solid #8a8886; border-radius:3px; font:inherit; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; }
  .check { font-weight:400; display:flex; gap:6px; align-items:center; margin:6px 0; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  button { padding:6px 10px; border:1px solid #8a8886; background:var(--bg); border-radius:3px; font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  details { margin-top:10px; } summary { cursor:pointer; font-weight:600; }
  #status { margin-top:12px; padding:8px 10px; background:var(--soft); border-radius:3px; min-height:1.5em; white-space:pre-wrap; }
  #status.err { background:#fde7e9; color:var(--bad); }
  table { border-collapse:collapse; width:100%; margin:4px 0 8px; font-size:12px; }
  th, td { text-align:left; padding:3px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { background:#d9e1f2; }
  td.n { text-align:right; font-variant-numeric:tabular-nums; }
  .pill { display:inline-block; padding:0 6px; border-radius:8px; background:var(--soft); margin-right:4px; }
  .warn { color:var(--warn); } .bad { color:var(--bad); } .ok { color:var(--ok); }
</style>
</head>
<body>
<h1>CPFR Weekly Review</h1>
<div class="sub">Runs on a tab already prepped with cpfr-sheet-prep-v3.</div>

<label for="sheet">Tab to review</label>
<select id="sheet"></select>

<details open>
  <summary>Settings</summary>
  <div class="grid">
    <div><label for="big">Big swing (±%)</label><input id="big" type="number" value="20" min="0" step="1"></div>
    <div><label for="watch">Watch (±%)</label><input id="watch" type="number" value="10" min="0" step="1"></div>
    <div><label for="minUnits">Also flag unit change ≥</label><input id="minUnits" type="number" value="800" min="0" step="50"></div>
    <div><label for="gap">Over-forecast gap ≤ (%)</label><input id="gap" type="number" value="-25" step="1"></div>
  </div>
  <label class="check"><input id="write" type="checkbox" checked> Create linked review tabs</label>
  <label class="check"><input id="replace" type="checkbox"> Replace existing review tabs</label>
</details>

<div class="btns">
  <button id="runAll" class="primary">Run all reviews</button>
  <button id="run1">1 · Comments</button>
  <button id="run2">2 · WoW swings</button>
  <button id="run3">3 · Stock-out risk</button>
</div>

<div id="status">Pick a tab and run a review.</div>
<div id="out"></div>

<script src="logic.js"></script>
<script src="taskpane.js"></script>
</body>
</html>
